<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
        }

        body {
            align-items: center;
            background: #f4f7fb;
            color: #172033;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        main {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(23, 32, 51, 0.12);
            padding: 2rem;
            width: min(100% - 2rem, 32rem);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 1rem 0 0.4rem;
        }

        input,
        textarea {
            border: 1px solid #c8d0dc;
            border-radius: 6px;
            box-sizing: border-box;
            font: inherit;
            padding: 0.75rem;
            width: 100%;
        }

        textarea {
            min-height: 8rem;
            resize: vertical;
        }

        button {
            background: #2563eb;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            margin-top: 1.25rem;
            padding: 0.75rem 1.25rem;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <h1>To-Do List</h1>
        <p>Add a new item to your to-do list.</p>

        <form action="#" method="post">
            <label for="item_id">Item ID</label>
            <input id="item_id" name="item_id" type="text">

            <label for="item_uuid">Item UUID</label>
            <input id="item_uuid" name="item_uuid" type="text">

            <label for="item_name">Item Name</label>
            <input id="item_name" name="item_name" type="text" required maxlength="200">

            <label for="item_description">Item Description</label>
            <textarea id="item_description" name="item_description" required maxlength="2000"></textarea>

            <button type="submit">Add To-Do</button>
        </form>
    </main>
</body>
</html>
